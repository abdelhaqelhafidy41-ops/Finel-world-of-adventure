apply plugin: 'com.android.application'

android {
    namespace = "com.worldofadventure.game"
    compileSdk = rootProject.ext.compileSdkVersion
    def releaseStoreFilePath = System.getenv("ANDROID_KEYSTORE_PATH")?.trim()
    def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")?.trim()
    def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    def missingSigningVars = []
    if (!releaseStoreFilePath) missingSigningVars << "ANDROID_KEYSTORE_PATH"
    if (releaseStorePassword == null || releaseStorePassword.trim().isEmpty()) missingSigningVars << "ANDROID_KEYSTORE_PASSWORD"
    if (!releaseKeyAlias) missingSigningVars << "ANDROID_KEY_ALIAS"
    if (releaseKeyPassword == null || releaseKeyPassword.trim().isEmpty()) missingSigningVars << "ANDROID_KEY_PASSWORD"
    def hasReleaseSigning = missingSigningVars.isEmpty()

    def validateReleaseSigning = {
        if (!hasReleaseSigning) {
            throw new GradleException(
                "Android release build requires signing credentials. Missing environment variable(s): ${missingSigningVars.join(', ')}."
            )
        }
        def keystoreFile = file(releaseStoreFilePath)
        if (!keystoreFile.exists() || !keystoreFile.isFile() || keystoreFile.length() <= 0L) {
            throw new GradleException(
                "Android release keystore file does not exist or is empty at ANDROID_KEYSTORE_PATH."
            )
        }
        try {
            def ks = java.security.KeyStore.getInstance(keystoreFile, releaseStorePassword.toCharArray())
            if (!ks.containsAlias(releaseKeyAlias) || !ks.isKeyEntry(releaseKeyAlias)) {
                throw new GradleException(
                    "Configured ANDROID_KEY_ALIAS was not found as a private key entry in the release keystore."
                )
            }
            if (ks.getKey(releaseKeyAlias, releaseKeyPassword.toCharArray()) == null) {
                throw new GradleException(
                    "Configured ANDROID_KEY_PASSWORD did not unlock the release key entry."
                )
            }
        } catch (GradleException ge) {
            throw ge
        } catch (Exception e) {
            throw new GradleException(
                "Failed to open or verify the Android release keystore (${e.class.simpleName}).",
                e
            )
        }
    }

    def isReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
        def lower = taskName.toLowerCase(java.util.Locale.ROOT)
        lower.contains("release") ||
            lower == "assemble" || lower.endsWith(":assemble") ||
            lower == "bundle" || lower.endsWith(":bundle")
    }
    if ("true".equalsIgnoreCase(System.getenv("REQUIRE_RELEASE_SIGNING")) || isReleaseTaskRequested) {
        validateReleaseSigning()
    }
    gradle.taskGraph.whenReady { taskGraph ->
        def runsReleasePackaging = taskGraph.allTasks.any { task ->
            def name = task.name.toLowerCase(java.util.Locale.ROOT)
            name.contains("release") && (
                name.startsWith("assemble") ||
                name.startsWith("bundle") ||
                name.startsWith("package") ||
                name.startsWith("sign") ||
                name.startsWith("validatesigning")
            )
        }
        if (runsReleasePackaging) {
            validateReleaseSigning()
        }
    }

    defaultConfig {
        applicationId "com.worldofadventure.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (System.getenv("ANDROID_VERSION_CODE")?.isInteger() ? System.getenv("ANDROID_VERSION_CODE").toInteger() : 1)
        versionName (System.getenv("ANDROID_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
