name: Automated GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest

    steps:
      - name: Validate version tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must match semantic version format such as v1.0.0."
            exit 1
          fi
          echo "Verified release tag: $TAG"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript check
        run: npm run lint

      - name: Build web production bundle
        env:
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
          VITE_MULTIPLAYER_URL: ${{ vars.VITE_MULTIPLAYER_URL || 'https://finel-world-of-adventure.abdelhaq-elhafidy-41.workers.dev' }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || vars.PUBLIC_APP_URL || 'https://abdelhaqelhafidy41-ops.github.io/Finel-world-of-adventure/' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || vars.VITE_PUBLIC_APP_URL || 'https://abdelhaqelhafidy41-ops.github.io/Finel-world-of-adventure/' }}
        run: npm run build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    needs: build-web

    outputs:
      signed: ${{ steps.verify-signatures.outputs.signed }}
      apk_cert_sha256: ${{ steps.verify-signatures.outputs.apk_cert_sha256 }}

    steps:
      - name: Validate required Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=()
          [ -z "${ANDROID_KEYSTORE_BASE64//[[:space:]]/}" ] && MISSING+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && MISSING+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${ANDROID_KEY_ALIAS//[[:space:]]/}" ] && MISSING+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ] && MISSING+=("ANDROID_KEY_PASSWORD")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Missing required Android signing secret(s): ${MISSING[*]}. Official releases strictly require all 4 signing secrets and will never fall back to Debug or unsigned builds."
            exit 1
          fi
          echo "All four required Android signing secrets are configured."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Download built web assets
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: dist

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode and validate release keystore
        id: keystore-check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${{ runner.temp }}/release.jks"
          rm -f "$KEYSTORE_FILE"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::Failed to decode ANDROID_KEYSTORE_BASE64."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi

          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded release keystore file does not exist or is empty."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi
          chmod 600 "$KEYSTORE_FILE"

          if ! LC_ALL=C keytool -list -keystore "$KEYSTORE_FILE" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null; then
            echo "::error::Failed to open release keystore with ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi

          ALIAS_INFO_FILE="${{ runner.temp }}/keytool-alias-info.txt"
          if ! LC_ALL=C keytool -list -v -keystore "$KEYSTORE_FILE" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > "$ALIAS_INFO_FILE"; then
            echo "::error::Configured ANDROID_KEY_ALIAS was not found in the release keystore."
            rm -f "$ALIAS_INFO_FILE"
            exit 1
          fi

          KEYSTORE_CERT_SHA256=$(grep -E '^\s*SHA256:' "$ALIAS_INFO_FILE" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          KEYSTORE_OWNER=$(grep -E '^\s*Owner:' "$ALIAS_INFO_FILE" | head -n 1 | sed 's/.*Owner:[[:space:]]*//')
          KEYSTORE_ENTRY_TYPE=$(grep -E '^\s*Entry type:' "$ALIAS_INFO_FILE" | head -n 1 | sed 's/.*Entry type:[[:space:]]*//')
          rm -f "$ALIAS_INFO_FILE"

          if [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::Failed to extract SHA-256 certificate fingerprint for the configured keystore alias."
            exit 1
          fi

          echo "Release keystore opened and alias verified."
          echo "Keystore entry type: ${KEYSTORE_ENTRY_TYPE:-PrivateKeyEntry}"
          echo "Keystore certificate Owner: ${KEYSTORE_OWNER:-unknown}"
          echo "Keystore certificate SHA-256: $KEYSTORE_CERT_SHA256"
          echo "cert_sha256=$KEYSTORE_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed Android Release APK and AAB
        id: android-build
        working-directory: android
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          export ANDROID_VERSION_NAME="${TAG#v}"
          export ANDROID_VERSION_CODE="${RUN_NUMBER}"
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify release APK and AAB signatures
        id: verify-signatures
        env:
          KEYSTORE_CERT_SHA256: ${{ steps.keystore-check.outputs.cert_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_SRC" ] || [ ! -s "$APK_SRC" ]; then
            echo "::error::Expected Release APK not found or empty at $APK_SRC"
            exit 1
          fi
          if [ ! -f "$AAB_SRC" ] || [ ! -s "$AAB_SRC" ]; then
            echo "::error::Expected Release AAB not found or empty at $AAB_SRC"
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER_BIN=$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER_BIN" ] || [ ! -x "$APKSIGNER_BIN" ]; then
            echo "::error::Android SDK apksigner binary not found under '$SDK_ROOT/build-tools'."
            exit 1
          fi
          echo "Using Android SDK apksigner: $APKSIGNER_BIN"

          APKSIGNER_OUT=$(mktemp "${{ runner.temp }}/apksigner-verify.XXXXXX")
          if ! "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_SRC" | tee "$APKSIGNER_OUT"; then
            echo "::error::apksigner verification failed for $APK_SRC"
            rm -f "$APKSIGNER_OUT"
            exit 1
          fi

          if grep -q "CN=Android Debug" "$APKSIGNER_OUT"; then
            echo "::error::Release APK is signed with the Android Debug certificate. Aborting release."
            rm -f "$APKSIGNER_OUT"
            exit 1
          fi

          APK_SHA256=$(grep -E 'Signer #1 certificate SHA-256 digest:' "$APKSIGNER_OUT" | head -n 1 | awk '{print tolower($NF)}')
          APK_DN=$(grep -E 'Signer #1 certificate DN:' "$APKSIGNER_OUT" | head -n 1 | sed 's/.*Signer #1 certificate DN:[[:space:]]*//')
          rm -f "$APKSIGNER_OUT"

          if [ -z "$APK_SHA256" ]; then
            echo "::error::Failed to extract Signer #1 SHA-256 digest from apksigner output."
            exit 1
          fi
          echo "Verified Release APK Signer DN: ${APK_DN:-unknown}"
          echo "Verified Release APK SHA-256: $APK_SHA256"

          if [ "$APK_SHA256" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::Release APK SHA-256 ($APK_SHA256) does not match configured keystore certificate SHA-256 ($KEYSTORE_CERT_SHA256)."
            exit 1
          fi

          AAB_VERIFY_OUT=$(mktemp "${{ runner.temp }}/aab-verify.XXXXXX")
          if ! LC_ALL=C jarsigner -verify -verbose -certs "$AAB_SRC" > "$AAB_VERIFY_OUT"; then
            echo "::error::jarsigner verification failed for $AAB_SRC"
            cat "$AAB_VERIFY_OUT"
            rm -f "$AAB_VERIFY_OUT"
            exit 1
          fi
          if grep -qi "jar is unsigned" "$AAB_VERIFY_OUT" || ! grep -q "jar verified." "$AAB_VERIFY_OUT"; then
            echo "::error::Release AAB is unsigned or failed signature verification."
            cat "$AAB_VERIFY_OUT"
            rm -f "$AAB_VERIFY_OUT"
            exit 1
          fi
          rm -f "$AAB_VERIFY_OUT"

          AAB_CERT_OUT=$(mktemp "${{ runner.temp }}/aab-cert.XXXXXX")
          LC_ALL=C keytool -printcert -jarfile "$AAB_SRC" > "$AAB_CERT_OUT"
          AAB_SHA256=$(grep -E '^\s*SHA256:' "$AAB_CERT_OUT" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          rm -f "$AAB_CERT_OUT"

          if [ -z "$AAB_SHA256" ] || [ "$AAB_SHA256" != "$APK_SHA256" ]; then
            echo "::error::Release AAB SHA-256 ('$AAB_SHA256') does not match Release APK SHA-256 ('$APK_SHA256')."
            exit 1
          fi
          echo "Verified Release AAB SHA-256: $AAB_SHA256"

          PREV_RELEASES=$(gh release list --limit 15 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' 2>/dev/null || true)
          PREV_OFFICIAL_TAG=""
          PREV_OFFICIAL_SHA256=""
          PREV_TMP_DIR=$(mktemp -d "${{ runner.temp }}/prev-apk.XXXXXX")

          while IFS= read -r rel_tag; do
            [ -z "$rel_tag" ] && continue
            [ "$rel_tag" = "$TAG" ] && continue
            rm -rf "$PREV_TMP_DIR"/*
            if gh release download "$rel_tag" --pattern "*.apk" --dir "$PREV_TMP_DIR" >/dev/null 2>&1; then
              PREV_APK=$(find "$PREV_TMP_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1 || true)
              if [ -n "$PREV_APK" ] && [ -f "$PREV_APK" ]; then
                PREV_VERIFY=$("$APKSIGNER_BIN" verify --print-certs "$PREV_APK" 2>/dev/null || true)
                PREV_DN=$(printf '%s\n' "$PREV_VERIFY" | grep -E 'Signer #1 certificate DN:' | head -n 1 | sed 's/.*Signer #1 certificate DN:[[:space:]]*//')
                PREV_SHA=$(printf '%s\n' "$PREV_VERIFY" | grep -E 'Signer #1 certificate SHA-256 digest:' | head -n 1 | awk '{print tolower($NF)}')
                if [ -n "$PREV_SHA" ]; then
                  if printf '%s' "$PREV_DN" | grep -q "CN=Android Debug"; then
                    echo "::warning::Previous release $rel_tag APK was signed with '$PREV_DN' (SHA-256: $PREV_SHA) before this fix; continuing scan for any earlier official release-signed APK."
                  else
                    PREV_OFFICIAL_TAG="$rel_tag"
                    PREV_OFFICIAL_SHA256="$PREV_SHA"
                    echo "Previous official release APK found in $PREV_OFFICIAL_TAG (DN: $PREV_DN, SHA-256: $PREV_OFFICIAL_SHA256)"
                    break
                  fi
                fi
              fi
            fi
          done <<< "$PREV_RELEASES"
          rm -rf "$PREV_TMP_DIR"

          if [ -n "$PREV_OFFICIAL_SHA256" ]; then
            if [ "$APK_SHA256" != "$PREV_OFFICIAL_SHA256" ]; then
              echo "::error::Release APK SHA-256 ($APK_SHA256) does not match previous official release $PREV_OFFICIAL_TAG SHA-256 ($PREV_OFFICIAL_SHA256)."
              exit 1
            fi
            echo "Release APK SHA-256 matches previous official release $PREV_OFFICIAL_TAG."
          else
            echo "No prior official release-signed APK found on GitHub Releases for SHA-256 comparison."
          fi

          mkdir -p release-assets
          cp "$APK_SRC" "release-assets/World-of-Adventure-${TAG}.apk"
          cp "$AAB_SRC" "release-assets/World-of-Adventure-${TAG}.aab"

          SRC_APK_SUM=$(sha256sum "$APK_SRC" | awk '{print $1}')
          OUT_APK_SUM=$(sha256sum "release-assets/World-of-Adventure-${TAG}.apk" | awk '{print $1}')
          SRC_AAB_SUM=$(sha256sum "$AAB_SRC" | awk '{print $1}')
          OUT_AAB_SUM=$(sha256sum "release-assets/World-of-Adventure-${TAG}.aab" | awk '{print $1}')

          if [ "$SRC_APK_SUM" != "$OUT_APK_SUM" ] || [ "$SRC_AAB_SUM" != "$OUT_AAB_SUM" ]; then
            echo "::error::Packaged release-assets checksum mismatch against verified release build outputs."
            exit 1
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "apk_cert_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          ls -lh release-assets/

      - name: Scrub temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks" "${{ runner.temp }}/keytool-alias-info.txt"

      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows Setup & Portable EXE
    runs-on: windows-latest
    needs: build-web

    env:
      npm_config_cache: ~/.npm
      npm_config_omit: ""
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron & electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Clean node_modules before installation
        shell: bash
        run: rm -rf node_modules

      - name: Install npm dependencies (including optional native bindings)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=optional
          else
            npm install --include=optional
          fi

      - name: Verify Windows x64 Rolldown and native bindings
        shell: bash
        run: |
          node -e "console.log(process.platform, process.arch)"
          npm ls rolldown
          npm ls @rolldown/binding-win32-x64-msvc
          node -e "require.resolve('@rolldown/binding-win32-x64-msvc')"

      - name: Download built web assets
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: dist

      - name: Package Windows Electron installer and portable EXE
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          npx electron-builder --win --config electron-builder.yml --publish never -c.extraMetadata.version="$VERSION_NAME"

          mkdir -p release-assets
          SETUP_SRC=$(find release -maxdepth 1 -type f -name "World-of-Adventure-Setup-*.exe" | head -n 1)
          PORTABLE_SRC=$(find release -maxdepth 1 -type f -name "World-of-Adventure-Portable-*.exe" | head -n 1)

          if [ -z "$SETUP_SRC" ] || [ ! -f "$SETUP_SRC" ]; then
            echo "::error::Windows Setup EXE was not generated."
            exit 1
          fi
          if [ -z "$PORTABLE_SRC" ] || [ ! -f "$PORTABLE_SRC" ]; then
            echo "::error::Windows Portable EXE was not generated."
            exit 1
          fi

          cp "$SETUP_SRC" "release-assets/World-of-Adventure-${TAG}-Windows-Setup.exe"
          cp "$PORTABLE_SRC" "release-assets/World-of-Adventure-${TAG}-Windows-Portable.exe"
          ls -lh release-assets/

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-windows]

    steps:
      - name: Checkout repository history for release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android release assets
        uses: actions/download-artifact@v4
        with:
          name: release-android-assets
          path: release-bundle

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: release-windows-assets
          path: release-bundle

      - name: Verify all required release files and Android signature
        env:
          EXPECTED_APK_CERT_SHA256: ${{ needs.build-android.outputs.apk_cert_sha256 }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REQUIRED=(
            "release-bundle/World-of-Adventure-${TAG}.apk"
            "release-bundle/World-of-Adventure-${TAG}.aab"
            "release-bundle/World-of-Adventure-${TAG}-Windows-Setup.exe"
            "release-bundle/World-of-Adventure-${TAG}-Windows-Portable.exe"
          )
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ] || [ ! -s "$f" ]; then
              echo "::error::Missing or empty required release asset: $f"
              exit 1
            fi
          done

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER_BIN=$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER_BIN" ] || [ ! -x "$APKSIGNER_BIN" ]; then
            echo "::error::Android SDK apksigner binary not found under '$SDK_ROOT/build-tools'."
            exit 1
          fi

          VERIFY_OUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "release-bundle/World-of-Adventure-${TAG}.apk")
          printf '%s\n' "$VERIFY_OUT"
          if printf '%s\n' "$VERIFY_OUT" | grep -q "CN=Android Debug"; then
            echo "::error::Downloaded release APK is debug-signed. Aborting GitHub Release creation."
            exit 1
          fi

          BUNDLED_APK_SHA256=$(printf '%s\n' "$VERIFY_OUT" | grep -E 'Signer #1 certificate SHA-256 digest:' | head -n 1 | awk '{print tolower($NF)}')
          if [ -z "$BUNDLED_APK_SHA256" ] || [ "$BUNDLED_APK_SHA256" != "$EXPECTED_APK_CERT_SHA256" ]; then
            echo "::error::Bundled APK signer SHA-256 ('$BUNDLED_APK_SHA256') does not match verified build-android SHA-256 ('$EXPECTED_APK_CERT_SHA256')."
            exit 1
          fi
          ls -lh release-bundle/

      - name: Generate structured release notes
        env:
          APK_CERT_SHA256: ${{ needs.build-android.outputs.apk_cert_sha256 }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"%s" 2>/dev/null || true)

          FEATURES=""
          FIXES=""
          PERF=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            lower=$(printf '%s' "$msg" | tr '[:upper:]' '[:lower:]')
            if [[ "$lower" == fix* || "$lower" == *bug* || "$lower" == *hotfix* || "$lower" == *repair* ]]; then
              FIXES="${FIXES}- ${msg}"$'\n'
            elif [[ "$lower" == perf* || "$lower" == *optimiz* || "$lower" == *fps* || "$lower" == *performance* || "$lower" == *cache* ]]; then
              PERF="${PERF}- ${msg}"$'\n'
            else
              FEATURES="${FEATURES}- ${msg}"$'\n'
            fi
          done <<< "$COMMITS"

          if [ -z "$FEATURES" ]; then
            FEATURES="- Cross-platform 3D open-world build for Web, Android (Capacitor), and Windows (Electron)."$'\n'
          fi
          if [ -z "$FIXES" ]; then
            FIXES="- Stability and cross-platform packaging refinements for offline asset loading and input handling."$'\n'
          fi
          if [ -z "$PERF" ]; then
            PERF="- Adaptive GraphicsQualityManager, chunked Three.js asset bundling, and hardware-accelerated rendering across desktop and mobile."$'\n'
          fi

          cat > release-notes.md <<EOF
          ## Version
          - **Release:** \`${TAG}\` (v${VERSION})
          - **Previous Tag:** ${PREV_TAG:-Initial Release}

          ## Downloads
          - \`World-of-Adventure-${TAG}.apk\` — Android installer package (release-signed; cert SHA-256: \`${APK_CERT_SHA256}\`)
          - \`World-of-Adventure-${TAG}.aab\` — Android App Bundle (Google Play, release-signed)
          - \`World-of-Adventure-${TAG}-Windows-Setup.exe\` — Windows x64 installer
          - \`World-of-Adventure-${TAG}-Windows-Portable.exe\` — Windows x64 portable executable

          ## New features
          ${FEATURES}
          ## Bug fixes
          ${FIXES}
          ## Performance improvements
          ${PERF}
          ## Known issues
          - Android APK and AAB are signed with the configured repository release keystore and verified with \`apksigner\` and \`jarsigner\`.
          - Windows executables are not signed with an Authenticode code-signing certificate; Windows SmartScreen may show an unrecognized publisher prompt on first launch.
          - Optional server-backed dynamic AI NPC dialogue automatically falls back to offline in-character dialogue when playing standalone Android or Windows builds offline.
          EOF

          cat release-notes.md

      - name: Create or update GitHub Release and attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "World of Adventure ${TAG}" \
              --notes-file release-notes.md
            gh release upload "$TAG" \
              "release-bundle/World-of-Adventure-${TAG}.apk" \
              "release-bundle/World-of-Adventure-${TAG}.aab" \
              "release-bundle/World-of-Adventure-${TAG}-Windows-Setup.exe" \
              "release-bundle/World-of-Adventure-${TAG}-Windows-Portable.exe" \
              --clobber
          else
            gh release create "$TAG" \
              "release-bundle/World-of-Adventure-${TAG}.apk" \
              "release-bundle/World-of-Adventure-${TAG}.aab" \
              "release-bundle/World-of-Adventure-${TAG}-Windows-Setup.exe" \
              "release-bundle/World-of-Adventure-${TAG}-Windows-Portable.exe" \
              --title "World of Adventure ${TAG}" \
              --notes-file release-notes.md
          fi
