name: Build Signed Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release versionName (e.g. 1.0.0). Defaults to tag or 1.0.0."
        required: false
        type: string
      version_code:
        description: "Release integer versionCode. Defaults to GitHub run number."
        required: false
        type: string

jobs:
  build-signed-release:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_B64//[[:space:]]/}" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "${KEY_ALIAS//[[:space:]]/}" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing one or more required GitHub Actions secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web game
        env:
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
          VITE_MULTIPLAYER_URL: ${{ vars.VITE_MULTIPLAYER_URL || 'https://finel-world-of-adventure.abdelhaq-elhafidy-41.workers.dev' }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || vars.PUBLIC_APP_URL || 'https://abdelhaqelhafidy41-ops.github.io/Finel-world-of-adventure/' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || vars.VITE_PUBLIC_APP_URL || 'https://abdelhaqelhafidy41-ops.github.io/Finel-world-of-adventure/' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version metadata
        id: version
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION_NAME="${REF_NAME#v}"
          else
            VERSION_NAME="1.0.0"
          fi

          if [ -n "$INPUT_VERSION_CODE" ]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            VERSION_CODE="$RUN_NUMBER"
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -lt 1 ]; then
            echo "::error::version_code must be a positive integer (got '$VERSION_CODE')."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building release versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Decode and validate release keystore outside repository
        id: keystore-check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${{ runner.temp }}/release.jks"
          rm -f "$KEYSTORE_FILE"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::Failed to decode ANDROID_KEYSTORE_BASE64."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi

          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file does not exist or is empty."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi
          chmod 600 "$KEYSTORE_FILE"

          if ! LC_ALL=C keytool -list -keystore "$KEYSTORE_FILE" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null; then
            echo "::error::Failed to open release keystore with ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi

          ALIAS_INFO_FILE="${{ runner.temp }}/keytool-alias-info.txt"
          if ! LC_ALL=C keytool -list -v -keystore "$KEYSTORE_FILE" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > "$ALIAS_INFO_FILE"; then
            echo "::error::Configured ANDROID_KEY_ALIAS was not found in the release keystore."
            rm -f "$ALIAS_INFO_FILE"
            exit 1
          fi

          KEYSTORE_CERT_SHA256=$(grep -E '^\s*SHA256:' "$ALIAS_INFO_FILE" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
          rm -f "$ALIAS_INFO_FILE"

          if [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::Could not extract SHA-256 certificate fingerprint from the release keystore alias."
            exit 1
          fi
          echo "Keystore validated; certificate SHA-256: $KEYSTORE_CERT_SHA256"
          echo "cert_sha256=$KEYSTORE_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK and AAB
        working-directory: android
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify signed APK and AAB artifacts
        env:
          KEYSTORE_CERT_SHA256: ${{ steps.keystore-check.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Signed Release APK was not generated at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ] || [ ! -s "$AAB_PATH" ]; then
            echo "::error::Signed Release AAB was not generated at $AAB_PATH"
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER_BIN=$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER_BIN" ] || [ ! -x "$APKSIGNER_BIN" ]; then
            echo "::error::Android SDK apksigner binary not found under '$SDK_ROOT/build-tools'."
            exit 1
          fi

          APKSIGNER_OUT=$(mktemp "${{ runner.temp }}/apksigner-verify.XXXXXX")
          if ! "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_PATH" | tee "$APKSIGNER_OUT"; then
            echo "::error::apksigner verification failed for $APK_PATH"
            rm -f "$APKSIGNER_OUT"
            exit 1
          fi
          if ! grep -qiE 'Verified using v2 scheme.*:[[:space:]]*true' "$APKSIGNER_OUT"; then
            echo "::error::Release APK did not pass mandatory APK Signature Scheme v2 verification."
            rm -f "$APKSIGNER_OUT"
            exit 1
          fi
          if grep -q "CN=Android Debug" "$APKSIGNER_OUT"; then
            echo "::error::Release APK is signed with the Android Debug certificate."
            rm -f "$APKSIGNER_OUT"
            exit 1
          fi

          APK_SHA256=$(grep -E 'certificate SHA-256 digest:' "$APKSIGNER_OUT" | head -n 1 | awk '{print tolower($NF)}' || true)
          APK_DN=$(grep -E 'certificate DN:' "$APKSIGNER_OUT" | head -n 1 | sed 's/.*certificate DN:[[:space:]]*//' || true)
          rm -f "$APKSIGNER_OUT"

          if [ -z "$APK_SHA256" ]; then
            echo "::error::Failed to extract certificate SHA-256 digest from apksigner output."
            exit 1
          fi
          echo "Verified Release APK Signer DN: ${APK_DN:-unknown}"
          echo "Verified Release APK SHA-256: $APK_SHA256"

          if [ "$APK_SHA256" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::Release APK SHA-256 ('$APK_SHA256') does not match keystore SHA-256 ('$KEYSTORE_CERT_SHA256')."
            exit 1
          fi

          AAB_VERIFY_OUT=$(mktemp "${{ runner.temp }}/aab-verify.XXXXXX")
          if ! LC_ALL=C jarsigner -verify -verbose -certs "$AAB_PATH" > "$AAB_VERIFY_OUT"; then
            echo "::error::jarsigner verification failed for $AAB_PATH"
            cat "$AAB_VERIFY_OUT"
            rm -f "$AAB_VERIFY_OUT"
            exit 1
          fi
          if grep -qi "jar is unsigned" "$AAB_VERIFY_OUT" || ! grep -q "jar verified." "$AAB_VERIFY_OUT"; then
            echo "::error::Release AAB is unsigned or failed verification."
            cat "$AAB_VERIFY_OUT"
            rm -f "$AAB_VERIFY_OUT"
            exit 1
          fi
          rm -f "$AAB_VERIFY_OUT"

          AAB_CERT_OUT=$(mktemp "${{ runner.temp }}/aab-cert.XXXXXX")
          LC_ALL=C keytool -printcert -jarfile "$AAB_PATH" > "$AAB_CERT_OUT"
          AAB_SHA256=$(grep -E '^\s*SHA256:' "$AAB_CERT_OUT" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
          rm -f "$AAB_CERT_OUT"
          if [ -z "$AAB_SHA256" ] || [ "$AAB_SHA256" != "$APK_SHA256" ]; then
            echo "::error::Release AAB SHA-256 ('$AAB_SHA256') does not match Release APK SHA-256 ('$APK_SHA256')."
            exit 1
          fi
          echo "Verified Release AAB SHA-256: $AAB_SHA256"

          ls -lh "$APK_PATH" "$AAB_PATH"

      - name: Scrub temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks" "${{ runner.temp }}/keytool-alias-info.txt"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: world-of-adventure-release-apk-v${{ steps.version.outputs.version_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: world-of-adventure-release-aab-v${{ steps.version.outputs.version_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
